<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tRongLich Dev // Bio Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #05070a;
            --card-bg: rgba(12, 18, 28, 0.75);
            --card-border: rgba(0, 240, 255, 0.25);
            --neon-cyan: #00f0ff;
            --neon-magenta: #ff007f;
            --neon-green: #00ff66;
            --neon-purple: #9d00ff;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --glass-blur: blur(20px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(255, 0, 127, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.08) 0%, transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }

        /* RAINBOW TEXT ANIMATION */
        @keyframes rainbowText {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        .rainbow-text {
            color: #00f0ff;
            background: linear-gradient(90deg, #ff007f, #00f0ff, #00ff66, #ff007f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rainbowText 5s linear infinite;
        }

        /* HEADER & ADMIN CONTROL BAR */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 6%;
            background: rgba(5, 7, 10, 0.85);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.3rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
        }

        .admin-status-bar {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-neon {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.25);
        }

        .btn-neon:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
            transform: translateY(-2px);
        }

        .btn-danger {
            border-color: var(--neon-magenta);
            color: var(--neon-magenta);
            box-shadow: 0 0 8px rgba(255, 0, 127, 0.25);
        }
        .btn-danger:hover {
            background: var(--neon-magenta);
            color: #fff;
            box-shadow: 0 0 20px var(--neon-magenta);
        }

        /* MAIN CONTAINER */
        .main-wrapper {
            max-width: 1300px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* PROFILE HEADER & AVATAR WRAPPER */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 35px;
            position: relative;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.15);
        }

        .profile-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 35px;
        }

        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .avatar-wrap {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .avatar-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        .avatar-frame {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 160px;
            height: 160px;
            pointer-events: none;
        }

        .henry-gaming {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
        }

        .user-info {
            flex: 1;
            min-width: 280px;
        }

        .social-links {
            display: flex;
            gap: 12px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .social-item {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .social-item:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.1);
            box-shadow: 0 0 15px var(--neon-cyan);
            transform: translateY(-3px);
        }

        /* SECTION HEADERS & CONTROLS */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 35px 0 20px 0;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.35rem;
            color: var(--neon-cyan);
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        /* UTILITY LINKS GRID */
        .utility-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 18px;
        }

        .link-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: var(--glass-blur);
        }

        .link-card:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.06);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
            transform: translateY(-3px);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }

        .link-left i {
            color: var(--neon-cyan);
            font-size: 1.2rem;
        }

        .link-title {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* SEARCH & FILTER CONTROLS */
        .controls-bar {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 18px 12px 45px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.25);
        }

        .search-box i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            border-color: var(--neon-cyan);
            color: var(--neon-cyan);
            background: rgba(0, 240, 255, 0.08);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* FILES GRID */
        .files-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 22px;
        }

        .file-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            position: relative;
        }

        .file-card:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.2);
            transform: translateY(-4px);
        }

        .file-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 14px;
        }

        .file-icon {
            font-size: 1.8rem;
            color: var(--neon-cyan);
            width: 50px;
            height: 50px;
            background: rgba(0, 240, 255, 0.08);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .file-img-preview {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            border: 1px solid var(--card-border);
        }

        .file-info {
            overflow: hidden;
        }

        .file-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .file-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.45;
        }

        .file-status-badge {
            display: inline-block;
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            letter-spacing: 0.5px;
        }

        .status-works { background: rgba(0, 255, 102, 0.15); color: var(--neon-green); border: 1px solid var(--neon-green); }
        .status-updated { background: rgba(0, 240, 255, 0.15); color: var(--neon-cyan); border: 1px solid var(--neon-cyan); }
        .status-maintenance { background: rgba(255, 0, 127, 0.15); color: var(--neon-magenta); border: 1px solid var(--neon-magenta); }

        .file-actions {
            display: flex;
            gap: 10px;
            margin-top: auto;
        }

        .btn-action {
            flex: 1;
            padding: 9px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 12px var(--neon-cyan);
        }

        .btn-disabled {
            opacity: 0.4;
            cursor: not-allowed;
            pointer-events: none;
            background: rgba(255, 0, 127, 0.1) !important;
            border-color: var(--neon-magenta) !important;
            color: var(--neon-magenta) !important;
        }

        /* MODALS */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.82);
            backdrop-filter: var(--glass-blur);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #090d16;
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.25);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            padding: 28px;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.25rem;
            color: var(--neon-cyan);
            margin-bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .close-btn:hover { color: var(--neon-magenta); }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 11px 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #fff;
            outline: none;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        /* ADMIN CONTROLS PER ITEM */
        .admin-controls-item {
            display: none;
            gap: 6px;
        }

        body.admin-mode .admin-controls-item {
            display: flex;
        }

        @media (max-width: 768px) {
            .profile-header {
                flex-direction: column;
                text-align: center;
            }
            .social-links {
                justify-content: center;
            }
            header {
                padding: 15px 4%;
            }
        }
    </style>
</head>
<body>

    <div id="jsi-flying-fish-container"></div>

    <!-- BACKGROUND AUDIO -->
    <audio id="bgMusic" loop>
        <source src="https://www.image2url.com/r2/default/audio/1792047413537-3ed3e6d1-63de-4165-bfec-8084c93a1fef.mp3" type="audio/mp3">
    </audio>

    <!-- HEADER & ADMIN CONTROL BAR -->
    <header>
        <div class="logo-title">
            <i class="fa-solid fa-microchip"></i> tRongLich // DASHBOARD
        </div>
        <div class="admin-status-bar">
            <span id="adminBadge" style="display: none; color: var(--neon-green); font-size: 0.85rem; font-weight: bold; font-family: 'Rajdhani', sans-serif;">
                <i class="fa-solid fa-user-shield"></i> ADMIN ACTIVE
            </span>
            <button class="btn-neon" id="adminBtn" onclick="toggleAdminAuth()">Đăng Nhập Admin</button>
        </div>
    </header>

    <div class="main-wrapper">
        <!-- PROFILE HEADER BIO -->
        <div class="glass-card">
            <div class="profile-header">
                <div class="avatar-section">
                    <div class="avatar-wrap">
                        <img id="bioAvatar" src="" class="avatar-img">
                        <img src="https://raw.githubusercontent.com/WusThanhDieu/Profile-ThanhDieu.Com-V5-Tester/refs/heads/main/res/v5/img/crown/mong-vuot-rong.png" class="avatar-frame">
                    </div>
                    <div class="henry-gaming rainbow-text" id="bioStatus"></div>
                </div>
                <div class="user-info">
                    <h1 class="rainbow-text" id="bioName" style="font-size: 3rem; margin: 0; line-height: 1;"></h1>
                    <div class="rainbow-text" id="bioSubtitle" style="font-size: 1.1rem; margin: 10px 0; font-weight: 600;"></div>
                    <p class="rainbow-text" id="bioDesc" style="font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px;"></p>
                    <div class="social-links" id="socialLinks">
                        <!-- JS rendered -->
                    </div>
                </div>
            </div>
            <div class="jd-music-container">
                <div id="contribution-grid"></div>
            </div>
            <button class="btn-neon admin-controls-item" onclick="openBioConfigModal()" style="position: absolute; top: 15px; right: 15px; font-size: 0.75rem; padding: 6px 12px;">
                <i class="fa-solid fa-pen"></i> Sửa Bio
            </button>
        </div>

        <!-- UTILITY LINKS SECTION -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-link"></i> <span id="utilityTitle">Tiện Ích & Liên Kết</span>
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="btn-neon admin-controls-item" onclick="openEditUtilityTitleModal()" style="font-size: 0.8rem;">
                    <i class="fa-solid fa-pen"></i> Đổi Tên Tiện Ích
                </button>
                <button class="btn-neon admin-controls-item" onclick="openAddLinkModal()" style="font-size: 0.8rem;">
                    <i class="fa-solid fa-plus"></i> Thêm Link
                </button>
            </div>
        </div>

        <div class="utility-grid" id="utilityGrid">
            <!-- JS rendered -->
        </div>

        <!-- FILE MANAGER SECTION -->
        <div class="section-header">
            <div class="section-title">
                <i class="fa-solid fa-folder-open"></i> Quản Lý File & Tài Nguyên
            </div>
            <button class="btn-neon admin-controls-item" onclick="openFileModal()" style="font-size: 0.8rem;">
                <i class="fa-solid fa-cloud-arrow-up"></i> Thêm File Mới
            </button>
        </div>

        <!-- SEARCH & FILTER BAR -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Tìm kiếm file 3105, file ios, tut trick, ipa ios..." oninput="renderFiles()">
            </div>
            <div class="filter-tabs">
                <button class="tab-btn active" onclick="filterCategory('all', this)">Tất cả</button>
                <button class="tab-btn" onclick="filterCategory('file 3105', this)">File 3105</button>
                <button class="tab-btn" onclick="filterCategory('file ios', this)">File iOS</button>
                <button class="tab-btn" onclick="filterCategory('tut trick', this)">Tut Trick</button>
                <button class="tab-btn" onclick="filterCategory('ipa ios', this)">IPA iOS</button>
            </div>
        </div>

        <!-- FILE GRID -->
        <div class="files-grid" id="filesGrid">
            <!-- JS rendered -->
        </div>
    </div>

    <!-- MODAL: ADMIN LOGIN -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>ĐĂNG NHẬP ADMIN</span>
                <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Mật khẩu Admin</label>
                <input type="password" id="adminPasswordInput" placeholder="Mật khẩu">
            </div>
            <button class="btn-neon" style="width: 100%;" onclick="loginAdmin()">Đăng Nhập</button>
        </div>
    </div>

    <!-- MODAL: EDIT BIO & PASSWORD -->
    <div class="modal" id="bioModal">
        <div class="modal-content">
            <div class="modal-header">
                <span>CẤU HÌNH BIO & ADMIN</span>
                <button class="close-btn" onclick="closeModal('bioModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Tên hiển thị HTML (Tên Bio)</label>
                <input type="text" id="editBioName">
            </div>
            <div class="form-group">
                <label>Status Badge / Welcome Text</label>
                <input type="text" id="editBioStatus">
            </div>
            <div class="form-group">
                <label>Avatar Image URL</label>
                <input type="text" id="editBioAvatar">
            </div>
            <div class="form-group">
                <label>Tiểu sử / Subtitle</label>
                <input type="text" id="editBioDesc">
            </div>
            <div class="form-group">
                <label>Facebook URL</label>
                <input type="text" id="editFb">
            </div>
            <div class="form-group">
                <label>Github URL</label>
                <input type="text" id="editGh">
            </div>
            <div class="form-group">
                <label>Telegram URL</label>
                <input type="text" id="editTg">
            </div>
            <div class="form-group">
                <label>TikTok URL</label>
                <input type="text" id="editTikTok">
            </div>
            <hr style="border-color: var(--card-border); margin: 18px 0;">
            <div class="form-group">
                <label>Mật Khẩu Admin Mới</label>
                <input type="password" id="editAdminPass" placeholder="Nhập mật khẩu mới nếu muốn đổi">
            </div>
            <button class="btn-neon" style="width: 100%;" onclick="saveBioConfig()">Lưu Thay Đổi</button>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT FILE -->
    <div class="modal" id="fileModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="fileModalTitle">QUẢN LÝ FILE & TÀI NGUYÊN</span>
                <button class="close-btn" onclick="closeModal('fileModal')">&times;</button>
            </div>
            <input type="hidden" id="editFileId">
            <div class="form-group">
                <label>Tên File / Tài Nguyên</label>
                <input type="text" id="fileNameInput" placeholder="Ví dụ: Bypass Config 3105">
            </div>
            <div class="form-group">
                <label>Thể Loại</label>
                <select id="fileCategorySelect">
                    <option value="file 3105">file 3105</option>
                    <option value="file ios">file ios</option>
                    <option value="tut trick">tut trick</option>
                    <option value="ipa ios">ipa ios</option>
                </select>
            </div>
            <div class="form-group">
                <label>URL Ảnh Xem Trước / Tình Trạng Tệp (Tùy chọn)</label>
                <input type="text" id="fileImgInput" placeholder="https://example.com/preview.png">
            </div>
            <div class="form-group">
                <label>Kích Thước (Ví dụ: 18 MB, 1.4 GB)</label>
                <input type="text" id="fileSizeInput" placeholder="18 MB">
            </div>
            <div class="form-group">
                <label>Tình Trạng File (Status)</label>
                <select id="fileStatusSelect">
                    <option value="works">Hoạt động tốt</option>
                    <option value="updated">Mới cập nhật</option>
                    <option value="maintenance">Đang bảo trì</option>
                </select>
            </div>
            <div class="form-group">
                <label>Đường Dẫn Tải / Download URL</label>
                <input type="text" id="fileUrlInput" placeholder="https://t.me/yourlink">
            </div>
            <div class="form-group">
                <label>Mô Tả Chi Tiết</label>
                <textarea id="fileDescInput" rows="3" placeholder="Mô tả tính năng hoặc cách sử dụng..."></textarea>
            </div>
            <button class="btn-neon" style="width: 100%;" onclick="saveFile()">Lưu File</button>
        </div>
    </div>

    <!-- MODAL: ADD / EDIT LINK -->
    <div class="modal" id="linkModal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="linkModalTitle">QUẢN LÝ LIÊN KẾT PHỤ</span>
                <button class="close-btn" onclick="closeModal('linkModal')">&times;</button>
            </div>
            <input type="hidden" id="editLinkId">
            <div class="form-group">
                <label>Tên Liên Kết</label>
                <input type="text" id="linkTitleInput" placeholder="Ví dụ: Kênh Telegram Share Key">
            </div>
            <div class="form-group">
                <label>Icon Class (FontAwesome)</label>
                <input type="text" id="linkIconInput" placeholder="fab fa-telegram-plane">
            </div>
            <div class="form-group">
                <label>Đường Dẫn URL</label>
                <input type="text" id="linkUrlInput" placeholder="https://t.me/...">
            </div>
            <button class="btn-neon" style="width: 100%;" onclick="saveLink()">Lưu Liên Kết</button>
        </div>
    </div>

    <script>
        // --- DEFAULT DATA ---
        const DEFAULT_BIO = {
            name: "𝓉ℛ𝑜𝓃𝒢<span style='color:#ff416c'>ℒℐ𝒸𝒽</span>",
            subtitle: "ℱ𝓊𝓁𝓁 𝒮𝓉𝒶𝒸𝓀 𝒟𝑒𝓋𝑒𝓁𝑜𝓅𝑒𝓇",
            status: "ℋ𝑒𝓁𝓁𝑜 𝑒𝓋𝑒𝓇𝓎𝑜𝓃𝑒. ℐ'𝓂 𝓉ℛ𝑜𝓃𝒢 ℒℐ𝒸𝒽 𝒟𝑒𝓋",
            avatar: "https://cdn.phototourl.com/member/2026-10-12-c8fb5492-1608-41a1-b9b5-6a984e34bddb.jpg",
            desc: "#𝒽𝑒𝓃𝓇𝓎_𝒹𝑒𝓋𝑒𝓁𝑜𝓅𝑒𝓇_𝒻𝓊𝓁𝓁𝓈𝓉𝒶𝒸𝓀",
            socials: {
                facebook: "https://facebook.com",
                github: "https://github.com",
                telegram: "https://t.me",
                tiktok: "https://tiktok.com"
            }
        };

        const DEFAULT_FILES = [
            { id: 1, name: "Bypass iOS Config 3105 Pro", category: "file 3105", size: "14.2 MB", status: "works", img: "", url: "https://t.me", desc: "Tệp tối ưu hóa cấu hình hệ thống chuyên dụng cho phân vùng 3105." },
            { id: 2, name: "IPA Tweak Client v3.4", category: "ipa ios", size: "48.5 MB", status: "updated", img: "", url: "https://t.me", desc: "Ứng dụng IPA đã mod tính năng tối ưu trải nghiệm trên thiết bị iOS." },
            { id: 3, name: "Tut Trick Overclock & Fix Lag", category: "tut trick", size: "3.1 MB", status: "maintenance", img: "", url: "https://t.me", desc: "Hướng dẫn thao tác lệnh thủ thuật xử lý độ trễ phần cứng." }
        ];

        const DEFAULT_LINKS = [
            { id: 1, title: "Kênh Telegram Chính Thức", icon: "fab fa-telegram-plane", url: "https://t.me" },
            { id: 2, title: "Facebook cá nhân", icon: "fab fa-facebook-f", url: "https://facebook.com" }
        ];

        // --- LOCAL STORAGE STATE WITH REAL-TIME SYNC ---
        let bioData = JSON.parse(localStorage.getItem('poarus_bio')) || DEFAULT_BIO;
        let filesData = JSON.parse(localStorage.getItem('poarus_files')) || DEFAULT_FILES;
        let linksData = JSON.parse(localStorage.getItem('poarus_links')) || DEFAULT_LINKS;
        let adminPass = localStorage.getItem('poarus_adminPass') || "1";
        let utilityTitle = localStorage.getItem('poarus_utilityTitle') || "Tiện Ích & Liên Kết";
        
        let isAdmin = false;
        let currentCategory = 'all';

        // --- INITIALIZATION ---
        function initApp() {
            renderBio();
            renderLinks();
            renderFiles();
            document.getElementById('utilityTitle').innerText = utilityTitle;
            initBackgroundMusic();
        }

        // --- BACKGROUND MUSIC AUTO-PLAY ON LOAD ---
        function initBackgroundMusic() {
            const music = document.getElementById('bgMusic');
            music.volume = 0.5;

            // Tự động phát nhạc khi vào trang
            music.play().catch(() => {
                // Trình duyệt chặn autoplay nếu chưa có tương tác -> Lắng nghe sự kiện click/touch/keydown đầu tiên để phát
                const autoPlayHandler = () => {
                    music.play().catch(e => console.log("Autoplay blocked:", e));
                    document.removeEventListener('click', autoPlayHandler);
                    document.removeEventListener('keydown', autoPlayHandler);
                    document.removeEventListener('touchstart', autoPlayHandler);
                };
                document.addEventListener('click', autoPlayHandler);
                document.addEventListener('keydown', autoPlayHandler);
                document.addEventListener('touchstart', autoPlayHandler);
            });
        }

        function saveData() {
            localStorage.setItem('poarus_bio', JSON.stringify(bioData));
            localStorage.setItem('poarus_files', JSON.stringify(filesData));
            localStorage.setItem('poarus_links', JSON.stringify(linksData));
            localStorage.setItem('poarus_adminPass', adminPass);
            localStorage.setItem('poarus_utilityTitle', utilityTitle);
        }

        // --- RENDER BIO REAL-TIME ---
        function renderBio() {
            document.getElementById('bioName').innerHTML = bioData.name;
            document.getElementById('bioSubtitle').innerHTML = bioData.subtitle || "ℱ𝓊𝓁𝓁 𝒮𝓉𝒶𝒸𝓀 𝒟𝑒𝓋𝑒𝓁𝑜𝓅𝑒𝓇";
            document.getElementById('bioStatus').innerText = bioData.status;
            document.getElementById('bioAvatar').src = bioData.avatar;
            document.getElementById('bioDesc').innerText = bioData.desc;

            const socialsContainer = document.getElementById('socialLinks');
            socialsContainer.innerHTML = `
                <a href="${bioData.socials.facebook || '#'}" target="_blank" class="social-item"><i class="fab fa-facebook-f"></i></a>
                <a href="${bioData.socials.github || '#'}" target="_blank" class="social-item"><i class="fab fa-github"></i></a>
                <a href="${bioData.socials.telegram || '#'}" target="_blank" class="social-item"><i class="fab fa-telegram-plane"></i></a>
                <a href="${bioData.socials.tiktok || '#'}" target="_blank" class="social-item"><i class="fab fa-tiktok"></i></a>
                <a href="#" class="social-item"><i class="fas fa-code-compare"></i></a>
            `;
        }

        // --- RENDER LINKS REAL-TIME ---
        function renderLinks() {
            const grid = document.getElementById('utilityGrid');
            grid.innerHTML = '';
            linksData.forEach(link => {
                const card = document.createElement('div');
                card.className = 'link-card';
                card.innerHTML = `
                    <a href="${link.url}" target="_blank" class="link-left" style="text-decoration:none; color:inherit; flex:1; overflow:hidden;">
                        <i class="${link.icon}"></i>
                        <span class="link-title">${link.title}</span>
                    </a>
                    <div class="admin-controls-item">
                        <button onclick="editLink(${link.id})" style="background:none; border:none; color:var(--neon-cyan); cursor:pointer; padding:4px;"><i class="fa-solid fa-pen"></i></button>
                        <button onclick="deleteLink(${link.id})" style="background:none; border:none; color:var(--neon-magenta); cursor:pointer; padding:4px;"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- RENDER FILES REAL-TIME WITH MAINTENANCE LOCK ---
        function renderFiles() {
            const grid = document.getElementById('filesGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            const filtered = filesData.filter(file => {
                const matchesCat = (currentCategory === 'all') || (file.category.toLowerCase() === currentCategory);
                const matchesSearch = file.name.toLowerCase().includes(searchVal) || file.desc.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(file => {
                let statusClass = 'status-works';
                let statusText = 'Hoạt động tốt';
                let isMaintenance = file.status === 'maintenance';

                if(file.status === 'updated') { statusClass = 'status-updated'; statusText = 'Mới Cập Nhật'; }
                if(isMaintenance) { statusClass = 'status-maintenance'; statusText = 'Đang Bảo Trì'; }

                const card = document.createElement('div');
                card.className = 'file-card';
                card.innerHTML = `
                    <div>
                        <div class="file-header">
                            ${file.img ? `<img src="${file.img}" class="file-img-preview" alt="Preview">` : `<div class="file-icon"><i class="fa-solid fa-file-code"></i></div>`}
                            <div class="file-info">
                                <div class="file-title">${file.name}</div>
                                <div class="file-meta">${file.category.toUpperCase()} • ${file.size}</div>
                            </div>
                        </div>
                        <span class="file-status-badge ${statusClass}">${statusText}</span>
                        <div class="file-desc">${file.desc}</div>
                    </div>
                    <div>
                        <div class="file-actions">
                            ${isMaintenance 
                                ? `<span class="btn-action btn-disabled"><i class="fa-solid fa-ban"></i> Đang bảo trì</span>`
                                : `<a href="${file.url}" target="_blank" class="btn-action"><i class="fa-solid fa-download"></i> Tải Về</a>`
                            }
                            <button onclick="copyToClipboard('${file.url}')" class="btn-action ${isMaintenance ? 'btn-disabled' : ''}"><i class="fa-solid fa-copy"></i> Sao Chép</button>
                        </div>
                        <div class="admin-controls-item" style="margin-top: 10px; justify-content: flex-end;">
                            <button class="btn-neon" onclick="editFile(${file.id})" style="font-size: 0.7rem; padding: 4px 10px;"><i class="fa-solid fa-pen"></i> Sửa</button>
                            <button class="btn-neon btn-danger" onclick="deleteFile(${file.id})" style="font-size: 0.7rem; padding: 4px 10px;"><i class="fa-solid fa-trash"></i> Xóa</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- FILTER CATEGORY ---
        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFiles();
        }

        // --- ADMIN AUTH ---
        function toggleAdminAuth() {
            if(isAdmin) {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminBadge').style.display = 'none';
                document.getElementById('adminBtn').innerText = 'Đăng Nhập Admin';
            } else {
                openModal('loginModal');
            }
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPasswordInput').value;
            if(pass === adminPass) {
                isAdmin = true;
                document.body.classList.add('admin-mode');
                document.getElementById('adminBadge').style.display = 'inline-block';
                document.getElementById('adminBtn').innerText = 'Đăng Xuất';
                closeModal('loginModal');
                document.getElementById('adminPasswordInput').value = '';
            } else {
                alert('Mật khẩu Admin không chính xác!');
            }
        }

        // --- ADMIN: BIO CONFIG REAL-TIME ---
        function openBioConfigModal() {
            document.getElementById('editBioName').value = bioData.name;
            document.getElementById('editBioStatus').value = bioData.status;
            document.getElementById('editBioAvatar').value = bioData.avatar;
            document.getElementById('editBioDesc').value = bioData.desc;
            document.getElementById('editFb').value = bioData.socials.facebook || '';
            document.getElementById('editGh').value = bioData.socials.github || '';
            document.getElementById('editTg').value = bioData.socials.telegram || '';
            document.getElementById('editTikTok').value = bioData.socials.tiktok || '';
            openModal('bioModal');
        }

        function saveBioConfig() {
            bioData.name = document.getElementById('editBioName').value;
            bioData.status = document.getElementById('editBioStatus').value;
            bioData.avatar = document.getElementById('editBioAvatar').value;
            bioData.desc = document.getElementById('editBioDesc').value;
            bioData.socials.facebook = document.getElementById('editFb').value;
            bioData.socials.github = document.getElementById('editGh').value;
            bioData.socials.telegram = document.getElementById('editTg').value;
            bioData.socials.tiktok = document.getElementById('editTikTok').value;

            const newPass = document.getElementById('editAdminPass').value;
            if(newPass.trim() !== "") {
                adminPass = newPass;
                alert("Đã cập nhật mật khẩu Admin!");
            }

            saveData();
            renderBio();
            closeModal('bioModal');
        }

        function openEditUtilityTitleModal() {
            const newTitle = prompt("Nhập tên hiển thị mới cho tiện ích:", utilityTitle);
            if(newTitle) {
                utilityTitle = newTitle;
                document.getElementById('utilityTitle').innerText = utilityTitle;
                saveData();
            }
        }

        // --- ADMIN: FILES MANAGEMENT REAL-TIME ---
        function openFileModal() {
            document.getElementById('editFileId').value = '';
            document.getElementById('fileNameInput').value = '';
            document.getElementById('fileImgInput').value = '';
            document.getElementById('fileSizeInput').value = '';
            document.getElementById('fileUrlInput').value = '';
            document.getElementById('fileDescInput').value = '';
            openModal('fileModal');
        }

        function editFile(id) {
            const file = filesData.find(f => f.id === id);
            if(!file) return;
            document.getElementById('editFileId').value = file.id;
            document.getElementById('fileNameInput').value = file.name;
            document.getElementById('fileCategorySelect').value = file.category;
            document.getElementById('fileImgInput').value = file.img || '';
            document.getElementById('fileSizeInput').value = file.size;
            document.getElementById('fileStatusSelect').value = file.status;
            document.getElementById('fileUrlInput').value = file.url;
            document.getElementById('fileDescInput').value = file.desc;
            openModal('fileModal');
        }

        function saveFile() {
            const id = document.getElementById('editFileId').value;
            const name = document.getElementById('fileNameInput').value;
            const category = document.getElementById('fileCategorySelect').value;
            const img = document.getElementById('fileImgInput').value;
            const size = document.getElementById('fileSizeInput').value;
            const status = document.getElementById('fileStatusSelect').value;
            const url = document.getElementById('fileUrlInput').value;
            const desc = document.getElementById('fileDescInput').value;

            if(!name || !url) {
                alert('Vui lòng nhập Tên file và Đường dẫn URL!');
                return;
            }

            if(id) {
                const index = filesData.findIndex(f => f.id == id);
                filesData[index] = { id: parseInt(id), name, category, img, size, status, url, desc };
            } else {
                filesData.push({ id: Date.now(), name, category, img, size, status, url, desc });
            }

            saveData();
            renderFiles();
            closeModal('fileModal');
        }

        function deleteFile(id) {
            if(confirm('Bạn có chắc chắn muốn xóa file này?')) {
                filesData = filesData.filter(f => f.id !== id);
                saveData();
                renderFiles();
            }
        }

        // --- ADMIN: LINKS MANAGEMENT REAL-TIME ---
        function openAddLinkModal() {
            document.getElementById('editLinkId').value = '';
            document.getElementById('linkTitleInput').value = '';
            document.getElementById('linkIconInput').value = 'fab fa-telegram-plane';
            document.getElementById('linkUrlInput').value = '';
            openModal('linkModal');
        }

        function editLink(id) {
            const link = linksData.find(l => l.id === id);
            if(!link) return;
            document.getElementById('editLinkId').value = id;
            document.getElementById('linkTitleInput').value = link.title;
            document.getElementById('linkIconInput').value = link.icon;
            document.getElementById('linkUrlInput').value = link.url;
            openModal('linkModal');
        }

        function saveLink() {
            const id = document.getElementById('editLinkId').value;
            const title = document.getElementById('linkTitleInput').value;
            const icon = document.getElementById('linkIconInput').value;
            const url = document.getElementById('linkUrlInput').value;

            if(!title || !url) {
                alert('Vui lòng điền đầy đủ Tên và URL liên kết!');
                return;
            }

            if(id) {
                const index = linksData.findIndex(l => l.id == id);
                if(index !== -1) {
                    linksData[index] = { id: parseInt(id), title, icon, url };
                }
            } else {
                linksData.push({ id: Date.now(), title, icon, url });
            }

            saveData();
            renderLinks();
            closeModal('linkModal');
        }

        function deleteLink(id) {
            if(confirm('Bạn có muốn xóa liên kết này?')) {
                linksData = linksData.filter(l => l.id !== id);
                saveData();
                renderLinks();
            }
        }

        // --- UTILS ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text);
            alert('Đã sao chép liên kết!');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        window.onload = initApp;
    </script>
</body>
</html>
